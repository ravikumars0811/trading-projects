input {
  tcp {
    port => 5000
    codec => json
  }

  # Optional: beats input for Filebeat
  # beats {
  #   port => 5044
  # }
}

filter {
  # Parse JSON logs
  if [message] =~ /^\{.*\}$/ {
    json {
      source => "message"
      target => "parsed_json"
    }
  }

  # Add metadata
  mutate {
    add_field => {
      "[@metadata][index_prefix]" => "microservices"
    }
  }

  # Parse log level
  if [level] {
    mutate {
      lowercase => ["level"]
    }
  }

  # Parse timestamp
  if [timestamp] {
    date {
      match => ["timestamp", "ISO8601"]
      target => "@timestamp"
    }
  }

  # Grok patterns for common log formats
  grok {
    match => {
      "message" => [
        "%{TIMESTAMP_ISO8601:timestamp} - %{WORD:service} - %{LOGLEVEL:level} - %{GREEDYDATA:log_message}",
        "%{COMBINEDAPACHELOG}"
      ]
    }
    overwrite => ["message"]
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "microservices-logs-%{+YYYY.MM.dd}"

    # Optional: authentication
    # user => "elastic"
    # password => "changeme"
  }

  # Debug output (optional - remove in production)
  stdout {
    codec => rubydebug
  }
}

# Algorithmic Trading System Configuration

# Trading Parameters
trading:
  initial_capital: 100000.0
  symbols:
    - AAPL
    - MSFT
    - GOOGL
    - AMZN
    - TSLA
    - NVDA
    - META
    - NFLX
  mode: live  # live, paper, backtest

# Risk Management
risk:
  max_position_size: 50000.0
  max_portfolio_value: 10000000.0
  max_daily_loss: 5000.0
  max_drawdown: 0.20
  max_leverage: 2.0
  max_concentration: 0.30
  var_limit: 100000.0
  max_orders_per_second: 100
  max_active_orders: 1000

# Strategies
strategies:
  moving_average:
    enabled: true
    short_period: 20
    long_period: 50
    symbols: all

  mean_reversion:
    enabled: true
    lookback_period: 50
    entry_threshold: 2.0
    exit_threshold: 0.5
    symbols: all

  momentum:
    enabled: true
    lookback_period: 20
    symbols: all

  ml_strategy:
    enabled: true
    model_path: ../python/models/lstm_predictor.pth
    symbols: all
    confidence_threshold: 0.7

# Market Data
market_data:
  provider: alpaca  # alpaca, interactive_brokers, polygon
  websocket_url: wss://stream.data.alpaca.markets/v2/iex
  api_key: ${ALPACA_API_KEY}
  api_secret: ${ALPACA_API_SECRET}
  reconnect_delay_ms: 5000
  buffer_size: 100000

# Execution
execution:
  mode: simulated  # simulated, live
  slippage_bps: 1.0
  latency_us: 1000
  fill_probability: 0.99
  commission_rate: 0.001

# Database
database:
  type: postgresql  # postgresql, timescaledb
  host: localhost
  port: 5432
  database: trading_db
  user: trading_user
  password: ${DB_PASSWORD}
  pool_size: 10

# Monitoring
monitoring:
  enabled: true
  prometheus_port: 9090
  log_level: INFO
  log_file: logs/trading_system.log
  metrics_interval_seconds: 10

# Backtesting
backtesting:
  start_date: 2023-01-01
  end_date: 2024-01-01
  initial_capital: 100000.0
  commission_rate: 0.001
  slippage_bps: 1.0
  enable_shorting: true

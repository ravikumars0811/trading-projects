version: '3.8'

services:
  # Financial LLM REST API
  api-rest:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    image: financial-llm:latest
    container_name: financial-llm-rest-api
    ports:
      - "8000:8000"
    environment:
      - MODEL_PATH=/models/best_model.pt
      - TOKENIZER_PATH=/models/tokenizer.pkl
      - DEVICE=cuda
      - LOG_LEVEL=info
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ../checkpoints:/models
      - ./logs:/app/logs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Financial LLM gRPC API
  api-grpc:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    image: financial-llm:latest
    container_name: financial-llm-grpc-api
    ports:
      - "50051:50051"
    environment:
      - MODEL_PATH=/models/best_model.pt
      - TOKENIZER_PATH=/models/tokenizer.pkl
      - DEVICE=cuda
      - API_TYPE=grpc
    volumes:
      - ../checkpoints:/models
      - ./logs:/app/logs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  # Redis for distributed rate limiting
  redis:
    image: redis:7-alpine
    container_name: financial-llm-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

  # Prometheus for metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: financial-llm-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    restart: unless-stopped

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: financial-llm-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    restart: unless-stopped

  # NGINX reverse proxy (optional)
  nginx:
    image: nginx:alpine
    container_name: financial-llm-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - api-rest
    restart: unless-stopped

volumes:
  redis-data:
  prometheus-data:
  grafana-data:

networks:
  default:
    name: financial-llm-network
